name: Test FAIL_LEVEL WARNING produces security findings
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAIL_LEVEL: WARNING
      APP_PATH: pristine/victoriadrake--django-security-check/v1.1.1/tests/fixtures/django-app
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull base Docker image
        run: docker pull python:3-buster || true

      - name: Run Django Security Check (FAIL_LEVEL=WARNING)
        id: check
        uses: .
        continue-on-error: true

      - name: Assert action step ran (outcome is success or failure)
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
