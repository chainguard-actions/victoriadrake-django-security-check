name: Test FAIL_LEVEL WARNING setting
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal Django project with insecure settings to trigger warnings
      - name: Create minimal Django app with insecure settings
        run: |
          mkdir -p tests/fixtures/warn-app/mysite
          touch tests/fixtures/warn-app/mysite/__init__.py

          cat > tests/fixtures/warn-app/manage.py << 'EOF'
          #!/usr/bin/env python
          import os
          import sys

          def main():
              os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'mysite.settings')
              try:
                  from django.core.management import execute_from_command_line
              except ImportError as exc:
                  raise ImportError(
                      "Couldn't import Django."
                  ) from exc
              execute_from_command_line(sys.argv)

          if __name__ == '__main__':
              main()
          EOF

          # Intentionally insecure settings to trigger Django security warnings
          cat > tests/fixtures/warn-app/mysite/settings.py << 'EOF'
          SECRET_KEY = 'test-secret-key-not-for-production'
          DEBUG = False
          ALLOWED_HOSTS = ['*']
          INSTALLED_APPS = [
              'django.contrib.contenttypes',
              'django.contrib.auth',
          ]
          DATABASES = {}
          # Intentionally missing security middleware and settings to trigger warnings:
          # No SECURE_SSL_REDIRECT, no SESSION_COOKIE_SECURE, no CSRF_COOKIE_SECURE, etc.
          EOF

      - name: Run Django Security Check with WARNING fail level
        id: check
        # This step is expected to produce output (warnings) but we don't assert exit code
        continue-on-error: true
        uses: .
        env:
          APP_PATH: tests/fixtures/warn-app
          FAIL_LEVEL: WARNING

      - name: Assert output.txt was created and contains Django check output
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/tests/fixtures/warn-app/output.txt"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: output.txt not found at $OUTPUT_FILE"
            echo "Listing app directory:"
            find "$GITHUB_WORKSPACE/tests/fixtures/warn-app" -type f 2>/dev/null || true
            exit 1
          fi
          echo "PASS: output.txt exists"
          echo "--- output.txt contents ---"
          cat "$OUTPUT_FILE"
          echo "--- end of output.txt ---"
          # The output should contain something from Django's check command
          # (either issues found or "System check identified no issues")
          if grep -qiE "(System check|security|issue|warning|error|check)" "$OUTPUT_FILE"; then
            echo "PASS: output.txt contains Django check output"
          else
            echo "FAIL: output.txt does not appear to contain Django check output"
            exit 1
          fi
