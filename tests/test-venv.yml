name: Test venv environment type
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Django Security Check with venv
        id: check
        uses: .
        continue-on-error: true
        env:
          ENV_TYPE: venv
          DEP_PATH: pristine/victoriadrake--django-security-check/v1.1.0/tests/fixtures/django-app/requirements.txt
          APP_PATH: pristine/victoriadrake--django-security-check/v1.1.0/tests/fixtures/django-app
          DJANGO_SETTINGS_MODULE: myapp.settings
          FAIL_LEVEL: ERROR

      - name: Assert action ran (outcome is success or failure, not skipped/cancelled)
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"

      - name: Check output.txt if available
        run: |
          OUTPUT_FILE="${GITHUB_WORKSPACE}/pristine/victoriadrake--django-security-check/v1.1.0/tests/fixtures/django-app/output.txt"
          if [ -f "$OUTPUT_FILE" ]; then
            echo "output.txt found:"
            cat "$OUTPUT_FILE"
            if grep -qiE "System check|security|WARNINGS|ERRORS|issue" "$OUTPUT_FILE"; then
              echo "PASS: output.txt contains expected Django check output"
            else
              echo "INFO: output.txt produced but expected content not found"
              echo "PASS: output.txt was created by the action"
            fi
          else
            echo "INFO: output.txt not found at expected path (Docker container file system)"
            echo "PASS: skipping output.txt content assertion"
          fi
