name: Test venv environment type
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run Django Security Check with venv ENV_TYPE
        id: check
        uses: .
        env:
          ENV_TYPE: venv
          DEP_PATH: tests/fixtures/django-app/requirements.txt
          APP_PATH: tests/fixtures/django-app
          FAIL_LEVEL: WARNING
          DJANGO_SETTINGS_MODULE: myapp.settings

      - name: Assert output.txt was created
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/tests/fixtures/django-app/output.txt"
          echo "Checking for output.txt at: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: output.txt was not created by the action"
            exit 1
          fi
          echo "PASS: output.txt exists"
          echo "--- output.txt contents ---"
          cat "$OUTPUT_FILE"

      - name: Assert output contains Django check results
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/tests/fixtures/django-app/output.txt"
          CONTENT=$(cat "$OUTPUT_FILE")
          echo "Content: $CONTENT"
          # Django check --deploy always produces some output (warnings or "System check identified no issues")
          if [ -z "$CONTENT" ]; then
            echo "FAIL: output.txt is empty, expected Django check output"
            exit 1
          fi
          echo "PASS: output.txt has content"
