name: Test basic usage (no venv)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal Django project in a subdirectory so the action can find manage.py
      - name: Create minimal Django app
        run: |
          mkdir -p tests/fixtures/basic-app/mysite
          touch tests/fixtures/basic-app/mysite/__init__.py

          cat > tests/fixtures/basic-app/manage.py << 'EOF'
          #!/usr/bin/env python
          import os
          import sys

          def main():
              os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'mysite.settings')
              try:
                  from django.core.management import execute_from_command_line
              except ImportError as exc:
                  raise ImportError(
                      "Couldn't import Django."
                  ) from exc
              execute_from_command_line(sys.argv)

          if __name__ == '__main__':
              main()
          EOF

          cat > tests/fixtures/basic-app/mysite/settings.py << 'EOF'
          SECRET_KEY = 'test-secret-key-not-for-production'
          DEBUG = False
          ALLOWED_HOSTS = ['*']
          INSTALLED_APPS = [
              'django.contrib.contenttypes',
              'django.contrib.auth',
          ]
          DATABASES = {}
          EOF

      - name: Run Django Security Check (no venv)
        id: check
        continue-on-error: true
        uses: .
        env:
          APP_PATH: tests/fixtures/basic-app
          FAIL_LEVEL: CRITICAL

      - name: Assert output.txt was created
        run: |
          OUTPUT_FILE="$GITHUB_WORKSPACE/tests/fixtures/basic-app/output.txt"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: output.txt not found at $OUTPUT_FILE"
            echo "Listing workspace:"
            find "$GITHUB_WORKSPACE/tests/fixtures/basic-app" -type f 2>/dev/null || true
            exit 1
          fi
          echo "PASS: output.txt exists"
          cat "$OUTPUT_FILE"
